# Hexo site configuration restored from the published static site.
title: Love you
subtitle: ''
description: ''
keywords:
  - Liz
  - cuijier
author: Liz
language: zh-CN
timezone: Asia/Shanghai

url: https://cuijier.github.io
root: /
permalink: :year/:month/:day/:title/
per_page: 10
archive_generator:
  per_page: 0
category_generator:
  per_page: 0
tag_generator:
  per_page: 0

# Keep Decap's YAML config as YAML; otherwise Hexo converts it to admin/config.json.
skip_render:
  - 'admin/**/*'

theme: next
theme_config:
  scheme: Muse
  darkmode: false
  menu:
    home: / || fa fa-home
    tags: /tags/ || fa fa-tags
    categories: /categories/ || fa fa-th
    archives: /archives/ || fa fa-archive
  menu_settings:
    icons: true
    badges: false
  sidebar:
    position: left
    display: post
  avatar:
    url: /images/avatar.gif
    rounded: false
    rotated: false
  social:
    GitHub: https://github.com/cuijier || fab fa-github

pretty_urls:
  trailing_index: true
  trailing_html: true

date_format: YYYY-MM-DD
time_format: HH:mm:ss
public_dir: public
