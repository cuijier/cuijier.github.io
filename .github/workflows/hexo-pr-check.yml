name: Verify Hexo pull request

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --global hexo-cli@4.3.2

      - name: Restore legacy image assets
        run: |
          mkdir -p source/images
          if [ -d images ]; then cp -a images/. source/images/; fi

      - name: Build site
        run: |
          hexo clean
          hexo generate

      - name: Verify routes, assets and CMS admin
        run: |
          test -f public/index.html
          test -f "public/2018/05/20/情人节/index.html"
          test -f "public/2018/10/08/留和路288号/index.html"
          test -f public/archives/index.html
          test -f public/categories/index.html
          test -f public/tags/index.html
          test -f public/CNAME
          grep -qx 'cuijier.github.io' public/CNAME
          test -f public/css/main.css
          test -f public/admin/index.html
          test -f public/admin/config.yml
          grep -q 'name: turbo-github' public/admin/config.yml
          grep -q 'REPLACE_WITH_DECAP_TURBO_SITE_ID' public/admin/config.yml
